<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Aukcji</title>
    <style>
        /* Reset podstawowych styli */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212; /* Ciemne tło strony */
            color: #e0e0e0;            /* Jasny tekst */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        /* GÓRNE MENU (NAVBAR) - USUNIĘTO LOGO */
        .navbar {
            position: sticky;
            top: 0;
            background-color: #1e1e1e; 
            border-bottom: 1px solid #2d2d2d;
            padding: 15px 30px;
            display: flex;
            justify-content: center; /* Wyśrodkowanie linków po usunięciu logo */
            align-items: center;
            z-index: 1000;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .navbar .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar .nav-links a:hover {
            color: #3b82f6; /* Niebieski akcent */
        }

        /* CENTRALNY KONTENER POD MENU */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            min-height: calc(100vh - 74px); 
            padding: 40px 20px;
            gap: 24px; /* Odstępy między tabelami i nagłówkiem */
        }

        .page-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        /* RESPONSYWNE KONTENERY DLA TABEL */
        .table-responsive {
            width: 100%;
            max-width: 800px;
            overflow-x: auto; 
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* STYLIZACJA TABEL (BEZ PODKREŚLEŃ) */
        table {
            width: 100%;
            border-collapse: collapse; 
            text-align: left;
        }

        th {
            background-color: #3b82f6; 
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 16px 20px;
        }

        td {
            padding: 16px 20px;
            font-size: 15px;
            border: none; 
        }

        tbody tr:hover {
            background-color: #252525;
            transition: background-color 0.2s ease;
        }

        /* Specjalny styl dla wiersza "Aukcja" wyśrodkowanego */
        .row-centered {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            background-color: #2a2a2a;
            color: #ffffff;
        }

        /* DOSTOSOWANIE DO EKRANÓW MOBILNYCH */
        @media (max-width: 600px) {
            .navbar .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-container {
                min-height: calc(100vh - 110px);
            }
        }
    </style>
</head>
<body>

    <!-- GÓRNE MENU (BEZ LOGO) -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#licytacje">Licytacje</a></li>
            <li><a href="#opis">Opis Tabeli</a></li>
            <li><a href="#jak-grac">Jak Grać</a></li>
            <li><a href="#logowanie">Logowanie</a></li>
        </ul>
    </nav>

    <!-- ZENTROWANA ZAWARTOŚĆ STRONY -->
    <main class="main-container">
        
        <!-- NOWA TABELA NAD NAPISEM (3 wiersze, 1 kolumna) -->
        <div class="table-responsive" style="max-width: 400px;"> <!-- węższa dla lepszego wyglądu -->
            <table>
                <tbody>
                    <tr>
                        <td>Użytkownicy Sprzedający</td>
                    </tr>
                    <tr>
                        <td>Przykładowy_Sprzedawca_1</td>
                    </tr>
                    <tr>
                        <td>Przykładowy_Sprzedawca_2</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- NAGŁÓWEK GŁÓWNY -->
        <h1 class="page-title">Czas Do Końca Aukcji</h1>

        <!-- GŁÓWNA TABELA -->
        <div class="table-responsive">
            <table>
                <thead>
                    <!-- NOWY: Pierwszy, jednokolumnowy wiersz na środku tabeli -->
                    <tr>
                        <th colspan="3" class="row-centered">Aukcja</th>
                    </tr>
                    <tr>
                        <th>Gracz</th>
                        <th>Kwota</th>
                        <th>Nr. Akcji</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Wiersz 1 -->
                    <tr>
                        <td>Gracz_101</td>
                        <td>1 200 zł</td>
                        <td>#A-9942</td>
                    </tr>
                    <!-- Wiersz 2 -->
                    <tr>
                        <td>Gracz_X</td>
                        <td>1 150 zł</td>
                        <td>#A-9941</td>
                    </tr>
                    <!-- Wiersz 3 -->
                    <tr>
                        <td>Sniper99</td>
                        <td>950 zł</td>
                        <td>#A-9938</td>
                    </tr>
                    <!-- Wiersz 4 -->
                    <tr>
                        <td>MistrzAukcji</td>
                        <td>800 zł</td>
                        <td>#A-9935</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
