<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciemna Strona z Menu</title>
    <style>
        /* Reset podstawowych styli */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212; /* Ciemne tło */
            color: #e0e0e0;            /* Jasny tekst niemęczący oczu */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }
body { margin: 0; padding-top: 60px
        /* Górne Menu (Navbar) */
        .navbar {
            position: fixed;
            top: 0;
            background-color: #1e1e1e; /* Nieco jaśniejsze tło dla odcięcia menu */
            border-bottom: 1px solid #2d2d2d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* Efekt najechania na link w menu */
        .navbar .nav-links a:hover {
            color: #3b82f6; /* Niebieski akcent */
        }

        /* Główny kontener strony */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 74px); /* Wysokość ekranu minus wysokość menu */
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background-color: #1e1e1e; /* Kontener karty */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 16px;
        }

        p {
            color: #a0a0a0;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        /* Dostosowanie do urządzeń mobilnych */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .navbar .nav-links {
                gap: 15px;
            }
    </style>
</head>
<body>

    <!-- NOWE MENU NA SAEJ GÓRZE -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#start">Instrukcja</a></li>
            <li><a href="#o-nas">Opis Tabeli</a></li>
            <li><a href="#uslugi">Logowanie</a></li>
            <li><a href="#kontakt">Kontakt</a></li>
        </ul>
    </nav>

</body>
</html>
