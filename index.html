<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosta Ciemna Strona</title>
    <style>
        body {
            background-color: #121212; /* Głęboka, matowa czerń */
            color: #e0e0e0;            /* Delikatna biel, niemęcząca oczu */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background-color: #1e1e1e; /* Nieco jaśniejszy kontener (karta) */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 16px;
        }
        p {
            line-height: 1.6;
            color: #a0a0a0;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 24px;
            background-color: #3b82f6; /* Kontrastowy akcent (niebieski) */
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
</body>
</html>
