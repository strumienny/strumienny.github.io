<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Aukcji</title>
    <style>
        /* Reset podstawowych styli */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Bordowe ozdobienie tła w postaci klimatycznej poświaty */
            background-color: #121212; 
            background-image: radial-gradient(circle at center, #4a0e17 0%, #121212 70%);
            background-attachment: fixed;
            color: #e0e0e0;            /* Jasny tekst */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        /* GÓRNE MENU (NAVBAR) */
        .navbar {
            position: sticky;
            top: 0;
            background-color: #1e1e1e; 
            border-bottom: 1px solid #2d2d2d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            z-index: 1000;
        }

        .navbar .menu-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .navbar .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        /* Aktywna zakładka podświetla się na jasny kolor */
        .navbar .nav-links a.active, .navbar .nav-links a:hover {
            color: #3b82f6; 
        }

        /* PODSTAWOWY STYL DLA SEKCJI ZAKŁADEK */
        .tab-content {
            display: none; /* Domyślnie wszystkie ukryte */
        }

        /* Sekcja aktywna staje się widoczna jako Flexbox na środku */
        .tab-content.active {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            min-height: calc(100vh - 74px); 
            padding: 40px 20px;
            gap: 24px; 
        }

        .page-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            white-space: pre-line; 
        }

        /* DODATKOWY STYL DLA INSTRUKCJI */
        .instruction-title {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
        }

        .instruction-text {
            font-size: 18px;
            color: #cbd5e1;
            text-align: center;
            max-width: 600px;
            white-space: pre-line;
            background-color: rgba(30, 30, 30, 0.6);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        /* STYL FORMULARZA LOGOWANIA */
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #a0a0a0;
        }

        .form-group input {
            background-color: #121212;
            border: 1px solid #3a3a3a;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        .btn-login {
            width: 100%;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #2563eb;
        }

        /* RESPONSYWNE KONTENERY DLA TABEL */
        .table-responsive {
            width: 100%;
            max-width: 800px;
            overflow-x: auto; 
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* STYLIZACJA TABEL */
        table {
            width: 100%;
            border-collapse: collapse; 
            text-align: left;
        }

        th {
            background-color: #3b82f6; 
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 16px 20px;
        }

        td {
            padding: 16px 20px;
            font-size: 15px;
            border: none; 
        }

        /* PIERWSZA TABELA - WYŚRODKOWANIE WPISÓW */
        .table-sellers table {
            text-align: center;
        }

        tbody tr:hover {
            background-color: #252525;
            transition: background-color 0.2s ease;
        }

        /* Słowo LICYTACJA na środku */
        .row-centered {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 6px; 
            background-color: #2a2a2a;
            color: #ffffff;
        }

        /* NOWE SZEROKOŚCI KOLUMN DLA DRUGIEJ TABELI PO ZAMIANIE */
        .col-nr-akcji {
            width: 20%; 
            white-space: nowrap; 
        }
        .col-uzytkownik {
            width: 50%; 
        }
        .col-kwota {
            width: 30%; 
        }

        /* DOSTOSOWANIE DO EKRANÓW MOBILNYCH */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .navbar .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .tab-content.active {
                min-height: calc(100vh - 110px);
            }
        }
    </style>
</head>
